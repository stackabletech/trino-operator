---
apiVersion: v2
name: trino-operator
version: "0.0.0-dev"
appVersion: "0.0.0-dev"
description: "Kubernetes operator for Trino. Deploy and run Trino coordinators and workers with the Stackable Data Platform (SDP)."
home: https://github.com/stackabletech/trino-operator
# One known use of this is the Artifact Hub (AH) listing which shows the logo.
# AH downloads the logo and re-hosts it.
# We opted to not use the project logos (e.g. the Apache Spark logo) here due to trademark concerns.
icon: https://raw.githubusercontent.com/stackabletech/trino-operator/main/.readme/static/borrowed/Icon_Stackable.svg
sources:
  - https://github.com/stackabletech/trino-operator
keywords: ["trino", "sql", "query-engine", "federation", "kubernetes", "operator", "big-data"]
# Artifact Hub drops any maintainer entry that has no email.
maintainers:
  - name: Stackable GmbH
    email: info@stackable.tech
    url: https://www.stackable.tech
# Consumed by Artifact Hub, see https://artifacthub.io/docs/topics/annotations/helm/
annotations:
  # The chart package ships no LICENSE file, so Artifact Hub cannot detect this itself.
  artifacthub.io/license: OSL-3.0
  # Artifact Hub currently infers this from "operator" in the chart name but I don't want to rely on the heuristics.
  artifacthub.io/operator: "true"
  # Unset means Artifact Hub predicts a category from the keywords, which it gets wrong a lot for our stuff
  artifacthub.io/category: database
  artifacthub.io/alternativeName: trino
  # A link named "support" is rendered highlighted by Artifact Hub. Keep it lowercase.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.stackable.tech/home/stable/trino/
    - name: Stackable Hub
      url: https://hub.stackable.tech/components/trino
    - name: support
      url: https://github.com/stackabletech/trino-operator/issues
    - name: Operator image on quay.io
      url: https://quay.io/repository/stackable/sdp/trino-operator
  artifacthub.io/crds: |-
    - kind: TrinoCluster
      version: v1alpha1
      name: trinoclusters.trino.stackable.tech
      displayName: TrinoCluster
      description: A Trino cluster stacklet. This resource is managed by the Stackable operator for Trino.
    - kind: TrinoCatalog
      version: v1alpha1
      name: trinocatalogs.trino.stackable.tech
      displayName: TrinoCatalog
      description: The TrinoCatalog resource can be used to define catalogs in Kubernetes objects.
