---
# The recreated StatefulSets must bring the cluster back to ready, and the recreated
# objects must carry an owner reference back to the TrinoCluster so that garbage
# collection still works for them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
timeout: 600
commands:
  - script: kubectl -n $NAMESPACE wait --for=condition=available trinoclusters.trino.stackable.tech/trino --timeout 601s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trino-coordinator-default
  ownerReferences:
    - apiVersion: trino.stackable.tech/v1alpha1
      controller: true
      kind: TrinoCluster
      name: trino
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trino-worker-default
  ownerReferences:
    - apiVersion: trino.stackable.tech/v1alpha1
      controller: true
      kind: TrinoCluster
      name: trino
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trino-serviceaccount
  ownerReferences:
    - apiVersion: trino.stackable.tech/v1alpha1
      controller: true
      kind: TrinoCluster
      name: trino
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trino-rolebinding
  ownerReferences:
    - apiVersion: trino.stackable.tech/v1alpha1
      controller: true
      kind: TrinoCluster
      name: trino
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trino-coordinator
  ownerReferences:
    - apiVersion: trino.stackable.tech/v1alpha1
      controller: true
      kind: TrinoCluster
      name: trino
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trino-worker
  ownerReferences:
    - apiVersion: trino.stackable.tech/v1alpha1
      controller: true
      kind: TrinoCluster
      name: trino
---
apiVersion: listeners.stackable.tech/v1alpha1
kind: Listener
metadata:
  name: trino-coordinator
  ownerReferences:
    - apiVersion: trino.stackable.tech/v1alpha1
      controller: true
      kind: TrinoCluster
      name: trino
---
apiVersion: v1
kind: Service
metadata:
  name: trino-coordinator-default-headless
  ownerReferences:
    - apiVersion: trino.stackable.tech/v1alpha1
      controller: true
      kind: TrinoCluster
      name: trino
---
apiVersion: v1
kind: Service
metadata:
  name: trino-worker-default-headless
  ownerReferences:
    - apiVersion: trino.stackable.tech/v1alpha1
      controller: true
      kind: TrinoCluster
      name: trino
