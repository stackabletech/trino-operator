---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-no-tls-check-script
data:
  check-s3-no-tls.py: |
    #!/usr/bin/env python
    #
    # Writes and reads a table on an S3 endpoint without TLS, through the Hive and the
    # Iceberg connector.
    #
    import argparse
    import sys

    import trino

    if not sys.warnoptions:
        import warnings

    warnings.simplefilter("ignore")


    def get_connection(username, password, coordinator):
        conn = trino.dbapi.connect(
            host=coordinator,
            port=8443,
            user=username,
            http_scheme="https",
            auth=trino.auth.BasicAuthentication(username, password),
            session_properties={"query_max_execution_time": "60s"},
        )
        conn._http_session.verify = False
        return conn


    def run_query(connection, query):
        print(f"[DEBUG] Executing query {query}")
        cursor = connection.cursor()
        cursor.execute(query)
        return cursor.fetchall()


    if __name__ == "__main__":
        all_args = argparse.ArgumentParser()
        all_args.add_argument(
            "-c",
            "--coordinator",
            required=True,
            help="Trino Coordinator Host to connect to",
        )
        all_args.add_argument(
            "-b", "--bucket", required=True, help="The S3 bucket name to use"
        )
        args = vars(all_args.parse_args())

        coordinator = args["coordinator"]
        bucket = args["bucket"]

        connection = get_connection("admin", "admin", coordinator)

        for catalog in ["hive", "iceberg"]:
            print(f"[INFO] Testing the {catalog} connector against plaintext S3")

            run_query(
                connection,
                f"CREATE SCHEMA IF NOT EXISTS {catalog}.plain WITH (location = 's3a://{bucket}/{catalog}-plain/')",
            )
            # Clean up leftovers from an earlier run so that the CTAS below is a real write.
            run_query(connection, f"DROP TABLE IF EXISTS {catalog}.plain.nation")

            rows_written = run_query(
                connection,
                f"CREATE TABLE {catalog}.plain.nation AS SELECT * FROM tpch.tiny.nation",
            )[0][0]
            assert rows_written == 25, f"Expected 25 rows written, got {rows_written}"

            rows_read = run_query(
                connection, f"SELECT COUNT(*) FROM {catalog}.plain.nation"
            )[0][0]
            assert rows_read == 25, f"Expected 25 rows, got {rows_read}"

            # A filtered read, because Iceberg can answer COUNT(*) from metadata alone and
            # would not need to fetch the data files.
            names = run_query(
                connection,
                f"SELECT name FROM {catalog}.plain.nation WHERE regionkey = 1 ORDER BY name",
            )
            assert len(names) == 5, f"Expected 5 nations in region 1, got {names}"

            run_query(connection, f"DROP TABLE {catalog}.plain.nation")

        print("[SUCCESS] All tests in check-s3-no-tls.py succeeded!")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-no-tls-check
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: integration-tests-sa
      restartPolicy: Never
      containers:
        - name: trino-test-helper
          image: oci.stackable.tech/sdp/testing-tools:0.2.0-stackable0.0.0-dev
          command:
            - python
            - /tmp/check-s3-no-tls.py
            - -c
            - trino-coordinator
            - -b
            - trino
          resources:
            requests:
              cpu: "250m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "64Mi"
          volumeMounts:
            - name: s3-no-tls-check-script
              mountPath: /tmp/check-s3-no-tls.py
              subPath: check-s3-no-tls.py
      volumes:
        - name: s3-no-tls-check-script
          configMap:
            name: s3-no-tls-check-script
