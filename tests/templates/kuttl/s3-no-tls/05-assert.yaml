---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 120
commands:
  # Both catalogs must be configured with a plaintext endpoint. The backslashes are the Java
  # properties escaping of `:` and are stripped before comparing.
  - script: |
      set -eu
      for role in coordinator worker; do
        for catalog in hive iceberg; do
          endpoint=$(kubectl -n "$NAMESPACE" get configmap "trino-$role-default-catalog" \
            -o go-template="{{ index .data \"$catalog.properties\" }}" \
            | grep '^s3.endpoint=' | tr -d '\\')
          if [ "$endpoint" != "s3.endpoint=http://minio:9000/" ]; then
            echo "ERROR: trino-$role-default-catalog $catalog.properties has '$endpoint'"
            exit 1
          fi
        done
      done
