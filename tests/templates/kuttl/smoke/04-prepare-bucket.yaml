---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      POD=$(kubectl -n $NAMESPACE get pod -l app=garage -o name | head -n 1 | sed -e 's#pod/##')
      kubectl cp -n $NAMESPACE -c s3-client yellow_tripdata_2021-07.csv $POD:/tmp
      # Talks to the Garage S3 API directly (no TLS, no proxy). The region must
      # match the s3_region in garage.yaml, Garage rejects other signatures.
      kubectl -n $NAMESPACE exec $POD -c s3-client -- \
        curl --fail --silent --show-error \
          --aws-sigv4 "aws:amz:region-1:s3" \
          --user "GK31c0ffee31c0ffee31c0ffee:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef" \
          --upload-file /tmp/yellow_tripdata_2021-07.csv \
          http://127.0.0.1:3900/trino/taxi-data/yellow_tripdata_2021-07.csv
